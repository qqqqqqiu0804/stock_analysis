{% extends 'base.html' %}
{% load static %}

{% block title %}登录 - 光伏舆情分析系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow mt-5">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-graph-up display-4 text-primary"></i>
                    <h3 class="mt-2">用户登录</h3>
                    <p class="text-muted">股票舆情与行情关联分析系统</p>
                </div>

                <div id="alertBox"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="btnLogin">
                        <i class="bi bi-box-arrow-in-right"></i> 登录
                    </button>
                </form>

                <div class="text-center">
                    <span class="text-muted">还没有账号？</span>
                    <a href="/register/">立即注册</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$('#loginForm').on('submit', function(e) {
    e.preventDefault();

    const username = $('#username').val().trim();
    const password = $('#password').val();

    if (!username || !password) {
        $('#alertBox').html('<div class="alert alert-warning">请填写用户名和密码</div>');
        return;
    }

    $('#btnLogin').prop('disabled', true).html('<span class="loading-spinner"></span> 登录中...');

    $.ajax({
        url: '/api/users/login/',
        type: 'POST',
        contentType: 'application/json',
        headers: { 'X-CSRFToken': getCookie('csrftoken') },
        data: JSON.stringify({ username, password }),
        success: function(data) {
            $('#alertBox').html('<div class="alert alert-success">登录成功，正在跳转...</div>');
            setTimeout(() => window.location.href = '/', 1000);
        },
        error: function(xhr) {
            const msg = xhr.responseJSON?.error || '登录失败，请重试';
            $('#alertBox').html(`<div class="alert alert-danger">${msg}</div>`);
            $('#btnLogin').prop('disabled', false).html('<i class="bi bi-box-arrow-in-right"></i> 登录');
        }
    });
});
</script>
{% endblock %}
