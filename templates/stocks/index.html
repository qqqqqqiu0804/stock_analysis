{% extends 'base.html' %}
{% load static %}

{% block title %}股票数据 - 光伏舆情分析系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-11">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-bar-chart"></i> 光伏行业股票数据</h2>
            <div class="search-box">
                <i class="bi bi-search search-icon"></i>
                <input type="text" id="searchInput" class="form-control" placeholder="搜索股票代码或名称..." style="width: 300px;">
            </div>
        </div>

        <!-- 股票列表 -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-list-ul"></i> 光伏行业股票列表</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>股票代码</th>
                                <th>股票名称</th>
                                <th>所属行业</th>
                                <th>最新价格</th>
                                <th>涨跌幅</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody">
                            <!-- 动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- K线图区域 -->
        <div class="card mb-4" id="klineSection" style="display: none;">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-graph-up"></i> <span id="klineTitle">K线图</span></h5>
                <div>
                    <select id="klineDays" class="form-select form-select-sm" style="width: auto; display: inline-block;">
                        <option value="30">近30天</option>
                        <option value="60" selected>近60天</option>
                        <option value="90">近90天</option>
                        <option value="180">近180天</option>
                    </select>
                </div>
            </div>
            <div class="card-body">
                <div id="klineChart" class="chart-container" style="height: 500px;"></div>
            </div>
        </div>

        <!-- 股票详情 -->
        <div class="card mb-4" id="stockDetail" style="display: none;">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-info-circle"></i> 股票详情</h5>
            </div>
            <div class="card-body" id="stockDetailContent">
                <!-- 动态加载 -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentStockCode = null;

// 加载股票列表
function loadStockList() {
    showLoading('stockTableBody');

    apiRequest(`${API_BASE}/stocks/summary/`)
        .done(function(data) {
            let html = '';
            data.forEach(stock => {
                const changeClass = stock.latest_change && parseFloat(stock.latest_change) >= 0 ? 'text-danger' : 'text-success';
                const changeIcon = stock.latest_change && parseFloat(stock.latest_change) >= 0 ? '▲' : '▼';

                html += `
                    <tr>
                        <td><strong>${stock.stock_code}</strong></td>
                        <td>${stock.stock_name}</td>
                        <td><span class="badge bg-secondary">${stock.industry || '光伏'}</span></td>
                        <td>${stock.latest_price || '-'}</td>
                        <td class="${changeClass}">
                            ${stock.latest_change ? changeIcon + ' ' + stock.latest_change + '%' : '-'}
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="showKline('${stock.stock_code}', '${stock.stock_name}')">
                                <i class="bi bi-graph-up"></i> K线图
                            </button>
                            <button class="btn btn-sm btn-outline-info" onclick="showDetail('${stock.stock_code}')">
                                <i class="bi bi-info-circle"></i> 详情
                            </button>
                        </td>
                    </tr>
                `;
            });
            $('#stockTableBody').html(html);
        })
        .fail(function() {
            showError('stockTableBody', '加载股票列表失败');
        });
}

// 显示K线图
function showKline(stockCode, stockName) {
    currentStockCode = stockCode;
    $('#klineSection').show();
    $('#klineTitle').text(`${stockName}(${stockCode}) K线图`);

    const days = parseInt($('#klineDays').val()) || 60;
    loadKlineData(stockCode, days);

    // 滚动到K线图位置
    $('html, body').animate({
        scrollTop: $('#klineSection').offset().top - 20
    }, 500);
}

// 加载K线图数据
function loadKlineData(stockCode, days) {
    showLoading('klineChart');

    apiRequest(`${API_BASE}/stocks/kline/${stockCode}/?days=${days}`)
        .done(function(data) {
            renderKlineChart(data);
        })
        .fail(function() {
            showError('klineChart', '加载K线数据失败');
        });
}

// 渲染K线图
function renderKlineChart(data) {
    const chart = initChart('klineChart');
    if (!chart) return;

    const option = {
        title: {
            text: data.stock.stock_name + ' 日K线图',
            left: 'center'
        },
        tooltip: {
            trigger: 'axis',
            axisPointer: {
                type: 'cross'
            }
        },
        legend: {
            data: ['日K', 'MA5', 'MA10', 'MA20', 'MA30'],
            top: 30
        },
        grid: {
            left: '10%',
            right: '10%',
            bottom: '15%'
        },
        xAxis: {
            type: 'category',
            data: data.dates,
            axisLine: { lineStyle: { color: '#8392A5' } }
        },
        yAxis: {
            scale: true,
            axisLine: { lineStyle: { color: '#8392A5' } },
            splitLine: { show: true, lineStyle: { type: 'dashed' } }
        },
        dataZoom: [
            {
                type: 'inside',
                start: 50,
                end: 100
            },
            {
                show: true,
                type: 'slider',
                bottom: 20,
                start: 50,
                end: 100
            }
        ],
        series: [
            {
                name: '日K',
                type: 'candlestick',
                data: data.kline_data,
                itemStyle: {
                    color: '#ef232a',
                    color0: '#14b143',
                    borderColor: '#ef232a',
                    borderColor0: '#14b143'
                }
            },
            {
                name: 'MA5',
                type: 'line',
                data: data.ma5,
                smooth: true,
                lineStyle: { opacity: 0.7, width: 1 },
                showSymbol: false
            },
            {
                name: 'MA10',
                type: 'line',
                data: data.ma10,
                smooth: true,
                lineStyle: { opacity: 0.7, width: 1 },
                showSymbol: false
            },
            {
                name: 'MA20',
                type: 'line',
                data: data.ma20,
                smooth: true,
                lineStyle: { opacity: 0.7, width: 1 },
                showSymbol: false
            },
            {
                name: 'MA30',
                type: 'line',
                data: data.ma30,
                smooth: true,
                lineStyle: { opacity: 0.7, width: 1 },
                showSymbol: false
            }
        ]
    };

    chart.setOption(option);
}

// 显示股票详情
function showDetail(stockCode) {
    $('#stockDetail').show();

    apiRequest(`${API_BASE}/stocks/${stockCode}/`)
        .done(function(data) {
            let html = `
                <div class="row">
                    <div class="col-md-6">
                        <table class="table table-borderless">
                            <tr><td class="text-muted" width="120">股票代码</td><td><strong>${data.stock_code}</strong></td></tr>
                            <tr><td class="text-muted">股票名称</td><td>${data.stock_name}</td></tr>
                            <tr><td class="text-muted">所属行业</td><td>${data.industry || '-'}</td></tr>
                            <tr><td class="text-muted">上市日期</td><td>${data.list_date || '-'}</td></tr>
                            <tr><td class="text-muted">市场</td><td>${data.market || '-'}</td></tr>
                        </table>
                    </div>
                    <div class="col-md-6">
                        <div class="d-flex gap-2 flex-wrap">
                            <a href="/news/?stock_code=${data.stock_code}" class="btn btn-outline-success">
                                <i class="bi bi-newspaper"></i> 查看舆情
                            </a>
                            <a href="/analysis/?stock_code=${data.stock_code}" class="btn btn-outline-warning">
                                <i class="bi bi-search"></i> 关联分析
                            </a>
                            <a href="/reports/create/?stock_code=${data.stock_code}" class="btn btn-outline-danger">
                                <i class="bi bi-file-earmark-text"></i> 生成报告
                            </a>
                        </div>
                    </div>
                </div>
            `;
            $('#stockDetailContent').html(html);
        })
        .fail(function() {
            showError('stockDetailContent', '加载股票详情失败');
        });
}

// 搜索功能
$('#searchInput').on('input', function() {
    const keyword = $(this).val().trim();
    if (keyword.length === 0) {
        loadStockList();
        return;
    }

    apiRequest(`${API_BASE}/stocks/search/?keyword=${keyword}`)
        .done(function(data) {
            let html = '';
            data.forEach(stock => {
                html += `
                    <tr>
                        <td><strong>${stock.stock_code}</strong></td>
                        <td>${stock.stock_name}</td>
                        <td><span class="badge bg-secondary">${stock.industry || '光伏'}</span></td>
                        <td>-</td>
                        <td>-</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="showKline('${stock.stock_code}', '${stock.stock_name}')">
                                <i class="bi bi-graph-up"></i> K线图
                            </button>
                        </td>
                    </tr>
                `;
            });
            $('#stockTableBody').html(html);
        });
});

// K线图天数切换
$('#klineDays').on('change', function() {
    if (currentStockCode) {
        const days = parseInt($(this).val()) || 60;
        loadKlineData(currentStockCode, days);
    }
});

// 页面加载时获取数据
$(document).ready(function() {
    loadStockList();
});
</script>
{% endblock %}
